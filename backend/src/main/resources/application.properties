# Application
spring.application.name=money-manager
server.port=${PORT:8080}

# Database (set via environment; see .env.example)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/money_manager_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# JWT: the secret has no default on purpose; the app refuses to start without one (min 32 bytes)
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.access-token-ttl=15m
app.jwt.refresh-token-ttl=7d

# Optional first admin account
app.admin.email=${APP_ADMIN_EMAIL:}
app.admin.password=${APP_ADMIN_PASSWORD:}

# CORS
app.cors.allowed-origins=${APP_CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

# Logging
logging.level.com.moneymanager=INFO
logging.level.org.springframework.security=INFO
